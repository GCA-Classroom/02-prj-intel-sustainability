<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title description">
  <title id="title">Intel greenhouse gas emissions trend</title>
  <desc id="description">A line graph showing greenhouse gas emissions declining from a peak in 2006 to much lower levels in 2023.</desc>
  <rect width="900" height="560" fill="#f2f5f7"/>
  <rect x="80" y="56" width="760" height="404" rx="8" fill="#ffffff" stroke="#d7e2ea" stroke-width="2"/>

  <text x="110" y="98" fill="#172b4d" font-family="Arial, sans-serif" font-size="26" font-weight="700">Intel GHG emissions trend</text>
  <text x="110" y="128" fill="#536575" font-family="Arial, sans-serif" font-size="16">Illustrative operational emissions index, 2006-2023</text>

  <g stroke="#d7e2ea" stroke-width="1">
    <line x1="130" y1="180" x2="790" y2="180"/>
    <line x1="130" y1="250" x2="790" y2="250"/>
    <line x1="130" y1="320" x2="790" y2="320"/>
    <line x1="130" y1="390" x2="790" y2="390"/>
  </g>

  <g fill="#536575" font-family="Arial, sans-serif" font-size="14" text-anchor="end">
    <text x="118" y="185">100</text>
    <text x="118" y="255">75</text>
    <text x="118" y="325">50</text>
    <text x="118" y="395">25</text>
    <text x="118" y="465">0</text>
  </g>

  <line x1="130" y1="160" x2="130" y2="460" stroke="#536575" stroke-width="2"/>
  <line x1="130" y1="460" x2="790" y2="460" stroke="#536575" stroke-width="2"/>

  <path d="M130 180 L239 205 L349 234 L459 278 L569 334 L679 376 L790 404 L790 460 L130 460 Z" fill="#00a3e0" opacity="0.12"/>
  <path d="M130 180 L239 205 L349 234 L459 278 L569 334 L679 376 L790 404" fill="none" stroke="#0054a6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <g fill="#ffffff" stroke="#0054a6" stroke-width="4">
    <circle cx="130" cy="180" r="7"/>
    <circle cx="239" cy="205" r="7"/>
    <circle cx="349" cy="234" r="7"/>
    <circle cx="459" cy="278" r="7"/>
    <circle cx="569" cy="334" r="7"/>
    <circle cx="679" cy="376" r="7"/>
    <circle cx="790" cy="404" r="7"/>
  </g>

  <g fill="#536575" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">
    <text x="130" y="486">2006</text>
    <text x="239" y="486">2009</text>
    <text x="349" y="486">2012</text>
    <text x="459" y="486">2015</text>
    <text x="569" y="486">2018</text>
    <text x="679" y="486">2021</text>
    <text x="790" y="486">2023</text>
  </g>

  <g font-family="Arial, sans-serif">
    <text x="145" y="166" fill="#0054a6" font-size="15" font-weight="700">Peak</text>
    <text x="728" y="393" fill="#0054a6" font-size="15" font-weight="700">Lower emissions</text>
    <text x="460" y="528" fill="#536575" font-size="14" text-anchor="middle">Year</text>
    <text x="36" y="315" fill="#536575" font-size="14" text-anchor="middle" transform="rotate(-90 36 315)">Emissions index</text>
  </g>
</svg>
